name: build-android-apk

# 正式版（v* tag）不在这里单独触发：由 install.yml 以 workflow_call 调用，APK 与桌面包一起进 Release
on:
  push:
    branches:
      - "v2"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "agent/**"
      - "tools/build_android_agents.py"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "agent/**"
      - "tools/build_android_agents.py"
  workflow_dispatch:
    inputs:
      maafw_version:
        description: "MaaFramework release tag，留空与 install.yml 一致取最新 release"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "构建的 git ref，留空取触发事件的 ref"
        type: string
        default: ""
      tag:
        description: "APK 文件名里的版本，留空按 git describe 计算"
        type: string
        default: ""
      maafw_version:
        type: string
        default: ""
    outputs:
      mafw_app_version:
        description: "APK 里的 BuildConfig.MAFW_APP_VERSION，即 Sentry release 里的外壳版本；取不到时为空"
        value: ${{ jobs.apk.outputs.mafw_app_version }}

permissions:
  contents: read

# 同一 PR / 分支再次推送时取消上一次运行；tag 推送、手动触发以及被 install.yml
# 调用出的发版 APK 不取消
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # agent 交叉编译用的 NDK；MaaFwApp 自身的 native 部分由 AGP 按其默认版本自动下载
  AGENT_NDK_VERSION: "29.0.13599879"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.mode.outputs.variants }}
      abis: ${{ steps.mode.outputs.abis }}
      tag: ${{ steps.mode.outputs.tag }}
      maafw_version: ${{ inputs.maafw_version || steps.maafw-latest-release.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: mode
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # 只出 arm64-v8a，且只出 release：debug 包每次 CI 都用 runner 上新生成的
          # debug keystore，签名每次都变，覆盖安装必然要卸载清数据；调试改用 release
          # 包 + 应用内「调试模式」（那套日志跟构建类型无关）。本机开发仍可 installDebug。
          # 不再出 universal（arm64-v8a + x86_64 合包）与 x86_64（模拟器）包。
          variants='["arm64-v8a"]'
          abis='["arm64-v8a"]'

          tag="${INPUT_TAG:-$(git describe --tags --match "v*" HEAD 2>/dev/null || git rev-parse --short HEAD)}"

          echo "variants=$variants" | tee -a "$GITHUB_OUTPUT"
          echo "abis=$abis" | tee -a "$GITHUB_OUTPUT"
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

      # 与 install.yml 保持一致：取 MaaFramework 最新 release
      - id: maafw-latest-release
        if: inputs.maafw_version == ''
        uses: step-security/github-action-get-latest-release@v0.8.2
        with:
          repository: MaaXYZ/MaaFramework
          excludes: "draft"
          token: ${{ secrets.GITHUB_TOKEN }}

  agents:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # C++ agent 的编译缓存。ccache 只在安装了它时才会被 MaaUtils 挂成 compiler launcher，
      # 命中时整份重编（约 3 分 40 秒）降到十几秒；key 与 NDK 版本、源码 hash 绑定
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.meta.outputs.abis) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Initialize MaaUtils submodule
        run: git submodule update --init --depth 1 agent/cpp-algo/MaaUtils

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache-dependency-path: |
            agent/go-service/go.mod
            agent/go-service/go.sum

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$AGENT_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$AGENT_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache MaaDeps
        uses: actions/cache@v5
        with:
          path: agent/cpp-algo/MaaUtils/MaaDeps
          key: maadeps-android-${{ matrix.abi }}-${{ hashFiles('tools/maadeps-download.py', 'agent/cpp-algo/MaaUtils/tools/maadeps_download.py') }}

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v5
        with:
          path: ./.cache/ccache
          # 源码或 NDK 版本一变就换 key；restore-keys 仍能从上一版做增量命中
          key: ccache-android-${{ matrix.abi }}-${{ env.AGENT_NDK_VERSION }}-${{ hashFiles('agent/cpp-algo/CMakeLists.txt', 'agent/cpp-algo/CMakePresets.json', 'agent/cpp-algo/cmake/**', 'agent/cpp-algo/source/**', 'agent/cpp-algo/MaaUtils/cmake/**', 'agent/cpp-algo/MaaUtils/MaaUtils.cmake') }}
          restore-keys: |
            ccache-android-${{ matrix.abi }}-${{ env.AGENT_NDK_VERSION }}-

      # Restore 会带回上一轮累计计数，先清零才能看出本次构建的真实命中率
      - name: Reset ccache stats
        run: ccache -z

      - name: Build agents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 外部输入经 env 传入，不直接拼进脚本
          ABI: ${{ matrix.abi }}
          MAAFW_VERSION: ${{ needs.meta.outputs.maafw_version }}
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
          # NDK 每轮都由 sdkmanager 现装，clang 的 mtime 每次都不同；按版本字符串校验才能命中
          CCACHE_COMPILERCHECK: string:${{ env.AGENT_NDK_VERSION }}
        run: |
          uv run tools/build_android_agents.py \
            --ndk "$ANDROID_NDK_ROOT" \
            --abi "$ABI" \
            --maafw-version "$MAAFW_VERSION" \
            --version "$VERSION_TAG"

      # PR 的缓存不保存，避免各分支的 restore-keys 互相污染；放在 ELF 校验前，
      # 构建成功就先落缓存，后续校验失败也不白编
      - name: Save ccache
        if: github.event_name != 'pull_request' && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ./.cache/ccache
          key: ccache-android-${{ matrix.abi }}-${{ env.AGENT_NDK_VERSION }}-${{ hashFiles('agent/cpp-algo/CMakeLists.txt', 'agent/cpp-algo/CMakePresets.json', 'agent/cpp-algo/cmake/**', 'agent/cpp-algo/source/**', 'agent/cpp-algo/MaaUtils/cmake/**', 'agent/cpp-algo/MaaUtils/MaaUtils.cmake') }}

      - name: Show ccache stats
        if: always()
        run: ccache -sv || true

      - name: Validate agent ELF files
        run: |
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          machine=${{ matrix.abi == 'arm64-v8a' && 'AArch64' || 'X86-64' }}
          for elf in Android/agent-dist/${{ matrix.abi }}/jniLibs/*.so; do
            "$readelf" -h "$elf" | grep -q "Machine:.*$machine"
            "$readelf" -l "$elf" | grep -q "/system/bin/linker64"
            "$readelf" -d "$elf" | grep NEEDED
          done

      # 只含本 ABI，产物内布局为 <abi>/jniLibs/lib*.so，可直接合并进 agent-dist
      - uses: actions/upload-artifact@v6
        with:
          name: agent-dist-${{ matrix.abi }}
          path: Android/agent-dist
          if-no-files-found: error
          retention-days: 7

  apk:
    needs: [meta, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.meta.outputs.variants) }}
    # matrix 里只有 arm64-v8a 一个 variant，输出取它的值即可
    outputs:
      mafw_app_version: ${{ steps.mafw_app_version.outputs.version }}
    env:
      ABIS: ${{ matrix.variant }}
    steps:
      # 版本号取自最外层仓库的 git describe / 提交数，需要完整历史
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Initialize submodules
        run: |
          # 与上一行同理：MaaFwApp 的版本号由它自己的 gradle 在检出目录里跑
          # git describe 得到，浅克隆没有 tag 会退化成裸短哈希并原样进 Sentry
          # release，所以这个子模块要带完整历史和 tag；describe 只用提交图，
          # blobless 克隆即可。model 子模块体积大且不参与版本计算，保持浅克隆。
          git submodule update --init --filter=blob:none Android/MaaFwApp
          git submodule update --init --depth 1 assets/resource/model

      # 临时：PI 的预设不能按控制器区分，桌面预设带不了只支持移动端的 AndroidOpenGame，
      # 只在打 Android 包时把它插到这三个预设的第一个
      - name: Prepend AndroidOpenGame to presets
        shell: python
        run: |
          import json
          from pathlib import Path

          for name in ("DailyFull", "QuickDaily", "RealtimeAssist"):
              path = Path("assets/tasks/preset") / f"{name}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              for preset in data["preset"]:
                  tasks = preset["task"]
                  if not tasks or tasks[0]["name"] != "AndroidOpenGame":
                      tasks.insert(0, {"name": "AndroidOpenGame"})
                  print(f"{path}: {preset['name']} -> {[t['name'] for t in tasks[:3]]}")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/MaaFwApp/**/*.gradle.kts', 'Android/MaaFwApp/**/gradle-wrapper.properties', 'Android/MaaFwApp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: actions/download-artifact@v7
        with:
          pattern: agent-dist-${{ matrix.variant }}
          path: Android/agent-dist
          merge-multiple: true

      - name: Deploy MaaFramework
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FW_ABI: ${{ matrix.variant }}
          MAAFW_VERSION: ${{ needs.meta.outputs.maafw_version }}
        run: |
          uv run scripts/setup_maa_framework.py \
            --abi "$FW_ABI" \
            --tag "$MAAFW_VERSION"

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=../profile.yaml"
            echo "build.debugAbi=${ABIS}"
            echo "build.releaseAbi=${ABIS}"
          } > local.properties
          cat local.properties

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::未配置 KEYSTORE_BASE64，产物是不签名的 release 包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      # APK 上报的 Sentry release 是 MaaFwApp@<MAFW_APP_VERSION>+<PI name>@<PI version>，
      # 直接取 gradle 生成的值交给 install.yml 登记 release，不在 CI 里另算一遍
      - name: Read MaaFwApp version
        id: mafw_app_version
        run: |
          build_config="Android/MaaFwApp/app/build/generated/source/buildConfig/release"
          version=$(grep -rhoP 'MAFW_APP_VERSION = "\K[^"]*' "$build_config" || true)
          if [[ -z "$version" ]]; then
            echo "::warning::$build_config 里找不到 MAFW_APP_VERSION，不会登记 Android Sentry release"
          elif [[ "$version" =~ ^[0-9a-f]{7,}$ ]]; then
            echo "::warning::MaaFwApp 检出里 git describe 找不到 tag，外壳版本退化成提交哈希 $version"
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      # 与桌面包同一命名 MaaEnd-<os>-<arch>-<tag>，Release 与 Mirror酱 上传都按这个名字认包
      # 只出 arm64-v8a：包里带 ABI 标记，应用内更新按标记选同 ABI 的包；
      # 旧版本装的是 universal 包，它只认不带 ABI 标记的资产，需手动换装一次后才会走自动更新
      - name: Rename APK
        env:
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          dir="Android/MaaFwApp/app/build/outputs/apk/release"
          count=$(find "$dir" -maxdepth 1 -name "*.apk" | wc -l)
          if [[ "$count" -ne 1 ]]; then
            echo "::error::预期恰好一个 APK，实际 $count 个"
            exit 1
          fi
          name="MaaEnd-android-$VARIANT-${VERSION_TAG//\//-}"
          mv "$dir"/*.apk "$dir/$name.apk"
          echo "APK_PATH=$dir/$name.apk" >> "$GITHUB_ENV"

      - name: Check APK native libraries
        run: |
          IFS=, read -ra abis <<< "$ABIS"
          for abi in "${abis[@]}"; do
            for lib in libcpp-algo.so libgo-service.so libMaaFramework.so libMaaAgentServer.so; do
              unzip -l "$APK_PATH" | grep -q "lib/$abi/$lib" || { echo "::error::$APK_PATH 缺少 lib/$abi/$lib"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-android-${{ matrix.variant }}-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-android-mapping
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
